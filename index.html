<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Cozy Pool Merge</title>
<link rel="icon" type="image/png" href="images/icon.png" />
<link rel="apple-touch-icon" href="images/icon.png" />
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
  :root{
    color-scheme: dark;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#eaf7fb;
    overflow:hidden;
    /* Mobile: no text selection, long-press callouts, tap flashes or
       pinch/double-tap zoom anywhere (iOS ignores user-scalable=no). */
    -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  #stage{
    position:fixed; inset:0;
    display:block;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    cursor:pointer;
    background:radial-gradient(ellipse at center, #f2fdff 0%, #cdeef7 100%);
  }

  /* =========================================================================
     Side panels (DOM, sit above the canvas): score/leaderboard on the left,
     "next tube" preview on the right. Purely informational — pointer-events
     are disabled so aiming/shooting on the canvas underneath still works.
     ========================================================================= */
  .side-panel{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    width:190px;
    box-sizing:border-box;
    padding:18px 16px;
    border-radius:20px;
    background:rgba(255,255,255,0.88);
    border:1px solid rgba(255,255,255,0.9);
    box-shadow:0 8px 24px rgba(20,90,120,0.18);
    color:#0b4a63;
    z-index:5;
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    pointer-events:none;
  }
  #leftPanel{ left:max(16px, env(safe-area-inset-left)); }
  #rightPanel{ right:max(16px, env(safe-area-inset-right)); text-align:center; }

  .panel-title{
    font-size:13px;
    font-weight:800;
    letter-spacing:1px;
    color:#0f8fc4;
    margin:0 0 8px;
    text-transform:uppercase;
  }
  #scoreValue{
    font-size:30px;
    font-weight:800;
    color:#0b4a63;
    margin:0 0 18px;
    transform:scale(1);
  }
  @keyframes scoreBump{ 0%{ transform:scale(1); } 50%{ transform:scale(1.2); } 100%{ transform:scale(1); } }
  #scoreValue.bump{ animation:scoreBump 0.2s ease; }

  .leaderboard-list{
    list-style:none;
    margin:0 0 20px;
    padding:0;
    display:flex; flex-direction:column; gap:6px;
    font-size:14px;
    font-weight:700;
    max-height:260px;
    overflow-y:auto;
  }
  .leaderboard-list li{
    display:flex; justify-content:space-between;
    padding:7px 10px;
    border-radius:10px;
  }
  #leaderboardList li{ background:rgba(51,204,255,0.14); }
  #leaderboardList li.empty{ justify-content:center; color:rgba(11,74,99,0.5); font-weight:500; }
  #leaderboardListModal li{ background:rgba(255,255,255,0.08); color:#eaf6fb; }
  #leaderboardListModal li.empty{ justify-content:center; color:rgba(234,246,251,0.55); font-weight:500; }

  .leaderboard-btn{
    display:none;
    pointer-events:auto;
    border:none;
    border-radius:10px;
    padding:7px 12px;
    font-size:12px;
    font-weight:700;
    background:rgba(51,204,255,0.22);
    color:#0b4a63;
    cursor:pointer;
    font-family:inherit;
  }

  #nextPreviewWrap{
    width:110px; height:110px;
    border-radius:50%;
    margin:0 auto;
    display:flex; align-items:center; justify-content:center;
    background:rgba(51,204,255,0.16);
    transition:background-color .2s ease;
  }
  #nextPreviewImg{
    width:86px; height:86px;
    object-fit:contain;
  }

  /* -------------------------------------------------------------------
     "Top" layout: toggled by JS (body.layout-top, see layoutMode in the
     script) when the window is tall/narrow enough that the normal side
     panels would overlap the square pool. The pool itself gets pushed
     down (see resize()) and score/next move into the freed-up top strip;
     the leaderboard collapses into a button that opens a popup instead
     of staying inline (there's no room for a list up there).
     ------------------------------------------------------------------- */
  body.layout-top #leftPanel{
    top:max(8px, env(safe-area-inset-top));
    left:max(8px, env(safe-area-inset-left));
    transform:none;
    width:auto;
    min-width:128px;
    padding:10px 14px;
  }
  body.layout-top #rightPanel{
    top:max(8px, env(safe-area-inset-top));
    right:calc(max(16px, env(safe-area-inset-right)) + 52px);
    transform:none;
    width:auto;
    padding:8px 12px;
  }
  /* Keep room beside the next-preview panel for the top-right settings gear. */
  body.layout-top .panel-title{ margin-bottom:4px; }
  body.layout-top #scoreValue{ margin-bottom:8px; font-size:24px; }
  body.layout-top #leaderboardTitle,
  body.layout-top #leaderboardList{ display:none; }
  body.layout-top .leaderboard-btn{ display:inline-block; }
  body.layout-top #nextPreviewWrap{ width:64px; height:64px; }
  body.layout-top #nextPreviewImg{ width:50px; height:50px; }

  /* Dim the DOM side panels + in-game settings gear along with the canvas
     when the run ends, so the whole screen (not just the pool) goes dark. */
  body.game-over #leftPanel,
  body.game-over #rightPanel,
  body.game-over #btnInGameSettings{
    filter:brightness(0.35);
    transition:filter .2s ease;
  }

  /* =========================================================================
     Main menu / settings overlay UI (DOM, sits above the canvas)
     ========================================================================= */
  .hidden{ display:none !important; }

  .screen{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    box-sizing:border-box;
    background:rgba(6,14,22,0.55);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    z-index:10;
  }

  .menu-card{
    width:100%; max-width:360px;
    box-sizing:border-box;
    padding:32px 28px 28px;
    border-radius:24px;
    background:rgba(18,40,53,0.92);
    border:1px solid rgba(255,255,255,0.12);
    color:#eaf6fb;
    text-align:center;
  }

  .modal-title{
    margin:0 0 22px;
    font-size:22px;
    font-weight:700;
  }

  .btn{
    display:block;
    width:100%;
    box-sizing:border-box;
    padding:14px 18px;
    margin-bottom:12px;
    border:none;
    border-radius:14px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:last-child{ margin-bottom:0; }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{
    background:#33ccff;
    color:#05222c;
  }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-secondary{
    background:rgba(255,255,255,0.08);
    color:#eaf6fb;
    border:1px solid rgba(255,255,255,0.18);
  }
  .btn-secondary:hover{ background:rgba(255,255,255,0.14); }

  .setting-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:14px 4px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    font-size:15px;
  }
  .setting-row:last-of-type{ border-bottom:none; }

  /* iOS-style toggle switch */
  .switch{ position:relative; display:inline-block; width:46px; height:26px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider-toggle{
    position:absolute; inset:0; cursor:pointer;
    background:rgba(255,255,255,0.18);
    border-radius:999px;
    transition:.2s;
  }
  .slider-toggle::before{
    content:""; position:absolute;
    width:20px; height:20px; left:3px; top:3px;
    background:#fff; border-radius:50%;
    transition:.2s;
  }
  .switch input:checked + .slider-toggle{ background:#33ccff; }
  .switch input:checked + .slider-toggle::before{ transform:translateX(20px); }

  input[type="range"]{
    -webkit-appearance:none; appearance:none;
    width:150px; height:4px;
    border-radius:999px;
    background:rgba(255,255,255,0.18);
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:18px; height:18px; border-radius:50%;
    background:#33ccff;
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:18px; height:18px; border-radius:50%; border:none;
    background:#33ccff;
    cursor:pointer;
  }
  input[type="range"]:disabled{ opacity:0.4; }

  #languageSelect{
    max-width:170px;
    padding:6px 10px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(255,255,255,0.08);
    color:#eaf6fb;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
  }
  #languageSelect option{ background:#122835; color:#eaf6fb; }

  #btnInGameSettings{
    position:fixed;
    top:max(16px, env(safe-area-inset-top));
    right:max(16px, env(safe-area-inset-right));
    width:44px; height:44px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.18);
    background:rgba(10,24,32,0.55);
    color:#eaf6fb;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    z-index:9;
    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
  }
  #btnInGameSettings:active{ transform:scale(0.94); }

  /* =========================================================================
     First-play tutorial (see the "Tutorial" section in the script): a
     pointing hand that demos the drag-to-aim gesture over the launcher,
     plus a tip bubble anchored above it. Both are positioned every frame
     from the pool's logical coordinates and never block input.
     ========================================================================= */
  #tutorialTip{
    position:fixed; left:0; top:0;
    z-index:6;
    box-sizing:border-box;
    max-width:min(300px, calc(100vw - 32px));
    padding:12px 16px;
    border-radius:16px;
    background:#fff;
    color:#0b4a63;
    box-shadow:0 8px 24px rgba(6,40,58,0.28);
    font-size:15px;
    font-weight:600;
    line-height:1.35;
    text-align:center;
    pointer-events:none;
    opacity:0;
    transition:opacity .25s ease;
  }
  #tutorialTip.show{ opacity:1; }
  #tutorialTip b{ color:#0f8fc4; }
  #tutorialTip b.danger{ color:#e8434b; }
  .tip-merge-row{
    display:flex; align-items:center; justify-content:center; gap:4px;
    margin-bottom:6px;
    font-size:22px; font-weight:800; color:#0f8fc4;
  }
  .tip-merge-row img{ width:44px; height:44px; object-fit:contain; }

  #tutorialHand{
    position:fixed; left:0; top:0;
    z-index:6;
    width:56px; height:70px;
    pointer-events:none;
    opacity:0;
    transform-origin:26px 3.5px; /* fingertip */
    filter:drop-shadow(0 4px 6px rgba(6,40,58,0.35));
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="leftPanel" class="side-panel hidden">
  <div class="panel-title" data-i18n="score">Score</div>
  <div id="scoreValue">0</div>
  <div class="panel-title" id="leaderboardTitle" data-i18n="leaderboard">Leaderboard</div>
  <ol id="leaderboardList" class="leaderboard-list"></ol>
  <button id="btnLeaderboard" class="leaderboard-btn" data-i18n="leaderboard">Leaderboard</button>
</div>

<div id="rightPanel" class="side-panel hidden">
  <div class="panel-title" data-i18n="next">Next</div>
  <div id="nextPreviewWrap">
    <img id="nextPreviewImg" alt="next" data-i18n-alt="next">
  </div>
</div>

<div id="leaderboardScreen" class="screen hidden">
  <div class="menu-card">
    <h2 class="modal-title" data-i18n="leaderboard">Leaderboard</h2>
    <ol id="leaderboardListModal" class="leaderboard-list"></ol>
    <button id="btnLeaderboardClose" class="btn btn-primary" data-i18n="ok">OK</button>
  </div>
</div>

<div id="settingsScreen" class="screen hidden">
  <div class="menu-card">
    <h2 class="modal-title" data-i18n="settings">Settings</h2>
    <div class="setting-row">
      <span data-i18n="soundEffects">Sound Effects</span>
      <label class="switch">
        <input type="checkbox" id="soundToggle" checked>
        <span class="slider-toggle"></span>
      </label>
    </div>
    <div class="setting-row">
      <span data-i18n="volume">Volume</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="80">
    </div>
    <div class="setting-row">
      <span data-i18n="language">Language</span>
      <select id="languageSelect"></select>
    </div>
    <div class="setting-row hidden" id="vibrationRow">
      <span data-i18n="vibration">Vibration</span>
      <label class="switch"><input type="checkbox" id="vibrationToggle" checked aria-label="Vibration" data-i18n-aria-label="vibration"><span class="slider-toggle"></span></label>
    </div>
    <div class="hidden" id="playGamesSettings">
      <p data-i18n="playGamesAccountHelp">Manage your game account in device settings: Google ? All services ? Play Games.</p>
      <p id="playGamesStatus" role="status" aria-live="polite"></p>
      <button id="btnPlayGamesSignIn" class="btn" data-i18n="playGamesSignIn">Sign in to Play Games</button>
      <button id="btnPlayGamesAccount" class="btn" data-i18n="playGamesAccount">Account settings</button>
      <button id="btnPlayGamesLeaderboard" class="btn" data-i18n="leaderboard">Leaderboard</button>
    </div>
    <button id="btnPrivacy" class="btn" data-i18n="privacyPolicy">Privacy Policy</button>
    <button id="btnSettingsClose" class="btn btn-primary" data-i18n="ok">OK</button>
  </div>
</div>

<button id="btnInGameSettings" class="hidden" title="Settings" aria-label="Settings" data-i18n-title="settings" data-i18n-aria-label="settings">⚙</button>

<dialog id="privacyDialog" aria-labelledby="privacyTitle" style="width:min(92vw,760px);height:85dvh;max-height:90vh;padding:16px;border:0;border-radius:16px;background:#fff;color:#183746;">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;height:44px;">
    <h2 id="privacyTitle" style="font-size:18px;margin:0" data-i18n="privacyPolicy">Privacy Policy</h2>
    <button id="btnPrivacyClose" class="btn" autofocus data-i18n="close">Close</button>
  </div>
  <iframe src="privacy/index.html" title="Privacy Policy / 개인정보처리방침" style="width:100%;height:calc(100% - 52px);border:0;margin-top:8px;"></iframe>
</dialog>
<div id="tutorialTip"></div>
<svg id="tutorialHand" viewBox="0 0 64 80" aria-hidden="true">
  <!-- Same shapes twice: a thick dark pass for the outline, then a white
       fill on top, so overlapping parts don't show inner seams. -->
  <g fill="#0b4a63" stroke="#0b4a63" stroke-width="8" stroke-linejoin="round">
    <rect x="24" y="4" width="12" height="46" rx="6"/>
    <rect x="36" y="30" width="11" height="24" rx="5.5"/>
    <rect x="46" y="34" width="10" height="22" rx="5"/>
    <rect x="12" y="40" width="44" height="34" rx="14"/>
    <rect x="6" y="38" width="12" height="24" rx="6" transform="rotate(-25 12 50)"/>
  </g>
  <g fill="#fff">
    <rect x="24" y="4" width="12" height="46" rx="6"/>
    <rect x="36" y="30" width="11" height="24" rx="5.5"/>
    <rect x="46" y="34" width="10" height="22" rx="5"/>
    <rect x="12" y="40" width="44" height="34" rx="14"/>
    <rect x="6" y="38" width="12" height="24" rx="6" transform="rotate(-25 12 50)"/>
  </g>
</svg>

<script>
(function(){
"use strict";

/* =========================================================================
   CAT MERGE — web port
   Ported from the Godot 4 project (Rapier2D physics) in this repo:
     Scripts/game_manager.gd, Scripts/main.gd, Scripts/launcher.gd, Scripts/slime.gd
     Scenes/Main.tscn, Scenes/slime.tscn, Scenes/GameOverScreen.tscn

   Gameplay/physics parity notes:
   - Zero gravity, frictionless circle bodies (bounce restitution 0.8),
     confined by a rectangular box (the original "Baffle" hollow polygon).
   - Launcher: drag to aim, release to shoot towards the drag point (not a
     slingshot pullback) — same as launcher.gd's shoot_dir/shoot_power math.
   - Merge rule: two same-level, non-merging slimes touching -> merge into
     next level at their midpoint, velocity = mass-weighted average (all
     masses are 1, same as Godot's default RigidBody2D mass), score added
     for the level that merged, both removed immediately.
   - Danger zone: circle at the launcher position; if any live slime stays
     inside it for 5 continuous seconds -> game over (same as the
     DangerArea + GameOverTimer in launcher.gd).

   Visual theme (new): clean vector "pool" reskin.
   - The play field is a fixed BASE_W×BASE_H rectangle, always — it no
     longer grows/shrinks with the browser window (letterboxed instead).
     Its shape follows images/BG2.png, a peanut-shaped checkered ring on a
     transparent canvas — see drawPoolFrame(). The playable area is the
     interior enclosed by that ring (filled with the sea); the ring is the
     wall. A distance field built from that image's alpha channel at load
     time (buildTrackMask()) drives both the slime-vs-wall collision and
     the water FX clipping, since the ring is an arbitrary curved shape,
     not 4 straight lines.
   - Slimes are rendered as cute round-eyed pool "tube floats" (a ring with
     a water-peek hole) instead of flat circles. Collision radius is
     unchanged — only the paint job changed.
   ========================================================================= */

  // ---------------------------------------------------------------------
  // GameManager equivalent (Scripts/game_manager.gd)
  // ---------------------------------------------------------------------
  // Size keeps growing every level (no more resetting/cycling back down) —
  // level 1 starts at the old level-5 size (260, per an earlier request),
  // and each level continues the same ~1.3x-per-level growth the original
  // table used, all scaled by SIZE_SCALE on top of that.
  // SIZE_SCALE was 0.8 for the old square pool; BG2.png's winding track is
  // only ~166px wide (median, at field scale) instead of a wide-open
  // square, so this is shrunk for the track — 0.37 gives level 1 a ~81px
  // collider diameter, a comfortable fraction of the track's width (still
  // clear of both edges even at the track's narrowest ~98px points), sized
  // up as far as felt reasonable without it constantly scraping both walls.
  // Upper levels (roughly level 5+, whose collider exceeds the local track
  // width) are expected to hug both edges as they squeeze through — the
  // per-level growth curve itself is untouched, only this one global knob.
  const SIZE_SCALE = 0.925; // 0.37 x2.5 for the wide peanut pool
  const SLIME_DATA = {
    1:  { color: "#ff5e62", size: 260.0  * SIZE_SCALE, score: 10 },
    2:  { color: "#ff9966", size: 340.0  * SIZE_SCALE, score: 20 },
    3:  { color: "#ffcc33", size: 450.0  * SIZE_SCALE, score: 40 },
    4:  { color: "#66ff99", size: 590.0  * SIZE_SCALE, score: 80 },
    5:  { color: "#33ccff", size: 770.0  * SIZE_SCALE, score: 160 },
    6:  { color: "#a18cd1", size: 1000.0 * SIZE_SCALE, score: 320 },
    7:  { color: "#fbc2eb", size: 1300.0 * SIZE_SCALE, score: 640 },
    8:  { color: "#ff5e62", size: 1690.0 * SIZE_SCALE, score: 1280 },
    9:  { color: "#ff9966", size: 2200.0 * SIZE_SCALE, score: 2560 },
    10: { color: "#ffcc33", size: 2860.0 * SIZE_SCALE, score: 5120 },
  };
  function getSlimeData(level){ return SLIME_DATA[level] || SLIME_DATA[1]; }

  // ---------------------------------------------------------------------
  // Slime face art — pool-float character images (images/*.png), assigned
  // smallest level first: fox, dog, mouse, cat, rabbit, dear. Levels beyond
  // the 6 images just cycle back through the same set (level 7 reuses
  // fox's art, etc.)
  // ---------------------------------------------------------------------
  const SLIME_IMAGE_NAMES = ["fox", "dog", "mouse", "cat", "rabbit", "dear"];
  const slimeImages = {};
  for (const name of SLIME_IMAGE_NAMES){
    const img = new Image();
    img.src = `images/${name}.png`;
    slimeImages[name] = img;
  }
  // Deer is the final friend: two deer merging disappear instead of
  // spawning a next level (see physicsStep's merge branch).
  const DEER_LEVEL = SLIME_IMAGE_NAMES.indexOf("dear") + 1;
  function getSlimeImage(level){
    const name = SLIME_IMAGE_NAMES[(level - 1) % SLIME_IMAGE_NAMES.length];
    return slimeImages[name];
  }

  // Keep a few power-of-two sizes per character; never upscale the source.
  const slimeSpriteCache = new Map();
  function getSlimeSprite(level, logicalDiameter){
    const img = getSlimeImage(level);
    if (!img || !img.complete || !img.naturalWidth) return img;
    const target = Math.max(32, logicalDiameter * scale * DPR);
    const size = Math.min(img.naturalWidth, 2 ** Math.ceil(Math.log2(target)));
    if (size >= img.naturalWidth) return img;
    const key = `${(level - 1) % SLIME_IMAGE_NAMES.length}:${size}`;
    if (!slimeSpriteCache.has(key)){
      const sprite = document.createElement("canvas");
      sprite.width = sprite.height = size;
      const g = sprite.getContext("2d");
      g.imageSmoothingQuality = "high";
      g.drawImage(img, 0, 0, size, size);
      slimeSpriteCache.set(key, sprite);
    }
    return slimeSpriteCache.get(key);
  }

  // ---------------------------------------------------------------------
  // Map/track art (images/BG2.png) — a winding S-shaped track drawn on a
  // mostly-transparent canvas (2569x3061, not a square frame like the old
  // images/BG.png). Since the field is a fixed BASE_W x BASE_H rectangle
  // matching that same aspect ratio (see the viewport section below), a
  // single ctx.drawImage() at one constant scale covers the whole field
  // with zero distortion, same as before — see drawPoolFrame().
  //
  // Like BG.png, BG2.png is a border frame — a peanut-shaped checkered
  // ring — around an open interior, which is the playable pool (filled
  // with the sea, see drawWater()). The ring is curved, not 4 straight
  // walls, so buildTrackMask() reads the image's alpha channel once it
  // loads into a small offscreen canvas (downsampled for speed/memory —
  // collision doesn't need full source resolution), flood-fills the
  // outside to isolate the enclosed interior, and runs a 2-pass Euclidean
  // distance transform (Felzenszwalb & Huttenlocher) over it, producing
  // distField: for every grid cell, the signed distance (in field px) to
  // the ring's inner edge. That single precomputed grid
  // answers both "how far can a slime's center be from the nearest wall"
  // (physicsStep's push-out) and "which direction is away from the nearest
  // wall" (the gradient, via sampleTrackNormal) without re-scanning the
  // image every frame.
  // ---------------------------------------------------------------------
  const bgImage = new Image();
  bgImage.src = "images/BG2.png";

  let trackReady = false;   // true once distField below is usable

    const t = tag.toLowerCase().replace(/_/g, "-");
    if (t.startsWith("zh")) return /hant|-tw|-hk|-mo/.test(t) ? "zh-TW" : "zh-CN";
    const base = t.split("-")[0];
    return STRINGS[base] ? base : null;
  }
  function detectLanguage(){

    try{

      if (q) return q;
    } catch(e){}
    const cg = matchLanguage(CG.locale);
    if (cg) return cg;
    const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
    for (const l of prefs){ const m = matchLanguage(l); if (m) return m; }
    return "en";
  }
