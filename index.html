  // ---------------------------------------------------------------------
  // Background music — bgm.mp3, looped continuously behind the game.
  // ---------------------------------------------------------------------
  const bgmAudio = new Audio("bgm.mp3");
  bgmAudio.loop = true;
  bgmAudio.volume = effectiveVolume();
  bgmAudio.muted = bgmAudio.volume === 0;

  // ---------------------------------------------------------------------
  // Audio — sample SFX from sounds/ (Kenney, CC0), with WebAudio-synthesized
  // fallbacks: a squeaky-rubber "boop" for a plain bounce,
  // and a bubbly water "pop" for a merge. Created lazily on first user
  // gesture (pointerdown) to satisfy autoplay policies.
  // ---------------------------------------------------------------------
  let audioCtx = null;
  let masterGain = null;
  function ensureAudio(){
    if (!audioCtx){
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      audioCtx = new Ctor();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = effectiveVolume();
      masterGain.connect(audioCtx.destination);
      loadSfx();
    }
    if (audioCtx.state !== "running") audioCtx.resume(); // "suspended" or iOS "interrupted"
    if (bgmAudio.paused && !gameOver) bgmAudio.play().catch(() => {});
    return audioCtx;
  }

  // Sample SFX — Kenney CC0 packs (see sounds/LICENSE.txt). Decoded into
  // AudioBuffers once the AudioContext exists; until a buffer is ready (or
  // if loading/decoding fails) the synthesized
  // fallbacks below are used instead.
  const SFX_FILES = {
    collision: [0, 1, 2, 3, 4].map(i => `sounds/collision_${i}.mp3`),
    merge: ["sounds/merge.mp3"],
    gameover: ["sounds/gameover.mp3"],
  };
  const sfxBuffers = { collision: [], merge: [], gameover: [] };
  function loadSfx(){
    for (const [key, urls] of Object.entries(SFX_FILES)){
      for (const url of urls){
        fetch(url)
          .then(r => r.arrayBuffer())
          .then(ab => new Promise((res, rej) => audioCtx.decodeAudioData(ab, res, rej)))
          .then(buf => sfxBuffers[key].push(buf))
          .catch(() => {});
      }
    }
  }
  // Plays a random buffer from the set; returns false if none are loaded.
  function playSample(key, gainValue, rate){
    const list = sfxBuffers[key];
    if (!list.length) return false;
    const src = audioCtx.createBufferSource();
    src.buffer = list[Math.floor(Math.random() * list.length)];
    src.playbackRate.value = rate || 1;
    const gain = audioCtx.createGain();
    gain.gain.value = gainValue;
    src.connect(gain); gain.connect(masterGain);
    src.start();
    return true;
  }

  // The jingle is a soft pizzicato that the BGM drowns out, so the music
  // stops for the game-over screen (restartGame() starts it again) and the
  // jingle is boosted (its peak is only ~0.5).
  function playGameOverSound(){
    bgmAudio.pause();
    if (!ensureAudio()) return;
    playSample("gameover", 1.8, 1);
  }

  let lastCollisionSoundT = -1, lastMergeSoundT = -1;
  const SOUND_MIN_GAP = 0.035; // seconds — keeps a pile-up of simultaneous
                                // collisions from turning into distorted mush

  function playCollisionSound(level){
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime;
    if (t0 - lastCollisionSoundT < SOUND_MIN_GAP) return;
    lastCollisionSoundT = t0;

    // Soft impact thud — bigger slimes thud a bit lower.
    if (playSample("collision", 1.0, 1.15 - Math.min(level, 10) * 0.04)) return;

    // Fallback: squeaky rubber tube-float "boop" — bigger slimes squeak lower.
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = "triangle";
    const baseFreq = 620 - Math.min(level, 10) * 28;
    osc.frequency.setValueAtTime(baseFreq * 1.5, t0);
    osc.frequency.exponentialRampToValueAtTime(Math.max(80, baseFreq * 0.7), t0 + 0.09);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.13);
    osc.connect(gain); gain.connect(masterGain);
    osc.start(t0); osc.stop(t0 + 0.15);
  }

  function playMergeSound(level){
    const ac = ensureAudio();
    if (!ac) return;
    const t0 = ac.currentTime;
    if (t0 - lastMergeSoundT < SOUND_MIN_GAP) return;
    lastMergeSoundT = t0;

    // Rising "level up" blip, pitched up a little for higher-level merges.
    if (playSample("merge", 1.0, 0.9 + Math.min(level, 10) * 0.05)) return;

    // Fallback: short filtered noise "plip" (water pop)...
    const bufSize = Math.max(1, Math.floor(ac.sampleRate * 0.06));
    const buffer = ac.createBuffer(1, bufSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    const noise = ac.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = ac.createBiquadFilter();
    noiseFilter.type = "bandpass";
    noiseFilter.frequency.value = 1100;
    noiseFilter.Q.value = 0.7;
    const noiseGain = ac.createGain();
    noiseGain.gain.setValueAtTime(0.22, t0);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.06);
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(masterGain);
    noise.start(t0);

    // ...plus a rising bubbly chime, pitched up for higher-level merges.
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = "sine";
    const baseFreq = 320 + Math.min(level, 10) * 34;
    osc.frequency.setValueAtTime(baseFreq, t0);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.1, t0 + 0.18);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.28, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);
    osc.connect(gain); gain.connect(masterGain);
    osc.start(t0); osc.stop(t0 + 0.32);
  }

  // ---------------------------------------------------------------------
  // Color helpers
  // ---------------------------------------------------------------------
  function hexToRgb(hex){
    const h = hex.replace("#","");
    return { r: parseInt(h.substr(0,2),16), g: parseInt(h.substr(2,2),16), b: parseInt(h.substr(4,2),16) };
  }
  function rgbToCss(c, a){ return `rgba(${c.r},${c.g},${c.b},${a===undefined?1:a})`; }
  function shade(hex, amt){
    // amt > 0 lightens toward white, amt < 0 darkens toward black
    const c = hexToRgb(hex);
    const t = amt > 0 ? 255 : 0;
    const p = Math.abs(amt);
    return {
      r: Math.round(c.r + (t - c.r) * p),
      g: Math.round(c.g + (t - c.g) * p),
      b: Math.round(c.b + (t - c.b) * p),
    };
  }
  function mixColor(hexA, hexB, t){
    const a = hexToRgb(hexA), b = hexToRgb(hexB);
    return { r: a.r + (b.r-a.r)*t, g: a.g + (b.g-a.g)*t, b: a.b + (b.b-a.b)*t };
  }

  // ---------------------------------------------------------------------
  // Canvas / logical-viewport setup
  // The play field ("pool") is a FIXED size, always — it no longer
  // grows/shrinks with the browser window or its aspect ratio (that used
  // to be project.godot's stretch mode "canvas_items" + aspect "expand",
  // which let the logical viewport expand to fill whatever space was
  // left over). Now we just fit BASE_W×BASE_H at a constant scale (the
  // smaller of the two ratios) and letterbox/pillarbox any leftover space
  // around it — the pool itself never changes size or shape.
  // ---------------------------------------------------------------------
  // BASE_W kept the same as the old square field; BASE_H is derived from
  // images/BG2.png's own aspect ratio (2569x3061, a tall winding track —
  // not square) so the art maps onto the field with one uniform scale and
  // no cropping/distortion, same principle the old square field used with
  // images/BG.png (see drawPoolFrame()).
  const BG2_NATIVE_W = 2569, BG2_NATIVE_H = 3061;
  const BASE_W = 1825, BASE_H = Math.round(BASE_W * BG2_NATIVE_H / BG2_NATIVE_W);
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  // viewW/viewH stay pinned to BASE_W/BASE_H (kept as separate variables
  // since the rest of the code already reads them generically); offsetX/Y
  // are the CSS-pixel letterbox offset used to center the fixed-size field
  // in whatever window it's shown in.
  let cssW = 0, cssH = 0, DPR = 1, scale = 1, viewW = BASE_W, viewH = BASE_H;
  let offsetX = 0, offsetY = 0;
  // Logical area that must stay on screen: the field, grown to include the
  // evolution guide once the outline is known (see updateFitBox()).
  let fitBox = { x0: 0, y0: 0, x1: BASE_W, y1: BASE_H };

  // Two layout modes for the DOM side panels (score/leaderboard, next):
  // "side" sits them left/right of the pool in the pillarbox space that
  // opens up once the fixed-size square pool is scaled to fit; "top" moves
  // them into a reserved strip above the pool instead, for windows tall/
  // narrow enough (portrait phones, etc.) that the pillarbox gutter is too
  // thin for the panels to fit beside the pool without overlapping it.
  const SIDE_GUTTER_MIN = 220; // css px — min pillarbox width the side panels need
  const TOP_BAR_MARGIN = 16;   // css px gap left between the panels and the pool top edge
  let layoutMode = "side";

  // Reads an element's actual rendered bottom edge (css px from the
  // viewport top), even if it currently has the "hidden" class — briefly
  // unhiding to measure and restoring immediately, so the reserved "top"
  // layout strip always matches the panels' real content height instead of
  // a guessed constant (guessed constants drift out of sync whenever the
  // panel markup/styling changes and start overlapping the pool again).
  function measuredBottom(el){
    const wasHidden = el.classList.contains("hidden");
    if (wasHidden) el.classList.remove("hidden");
    const bottom = el.getBoundingClientRect().bottom;
    if (wasHidden) el.classList.add("hidden");
    return bottom;
  }

  function resize(){
    cssW = window.innerWidth;
    cssH = window.innerHeight;
    if (cssW < 1 || cssH < 1) return; // pane not laid out yet (0 size) — keep previous valid geometry
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    canvas.width = Math.round(cssW * DPR);
    canvas.height = Math.round(cssH * DPR);

    // Fit the field plus anything drawn around it (the evolution guide
    // sits outside the ring, past the field's edges) — see fitBox.
    const fitW = fitBox.x1 - fitBox.x0, fitH = fitBox.y1 - fitBox.y0;
    const scaleWide = Math.min(cssW / fitW, cssH / fitH); // fit, never expand
    const sideGutter = (cssW - fitW * scaleWide) / 2;
    layoutMode = sideGutter >= SIDE_GUTTER_MIN ? "side" : "top";
    document.body.classList.toggle("layout-top", layoutMode === "top");

    if (layoutMode === "side"){
      scale = scaleWide;
      offsetX = sideGutter - fitBox.x0 * scale;
      offsetY = (cssH - fitH * scale) / 2 - fitBox.y0 * scale;
    } else {
      // Panels are now styled per body.layout-top (class just toggled
      // above), so measuring their bottoms here reflects the real "top"
      // layout, not the vertically-centered "side" one.
      const topBarH = Math.max(measuredBottom(leftPanelEl), measuredBottom(rightPanelEl)) + TOP_BAR_MARGIN;
      const availH = Math.max(cssH - topBarH, 50);
      scale = Math.min(cssW / fitW, availH / fitH);
      offsetX = (cssW - fitW * scale) / 2 - fitBox.x0 * scale;
      offsetY = topBarH + (availH - fitH * scale) / 2 - fitBox.y0 * scale;
    }

    layoutForViewport();
    bgCacheDirty = true; // canvas size/transform changed — see rebuildBgCache()
    tipSize = null;      // tip max-width depends on the viewport — see setTip()
  }

  function toLogical(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    return { x: (clientX - rect.left - offsetX) / scale, y: (clientY - rect.top - offsetY) / scale };
  }

  // ---------------------------------------------------------------------
  // Physics constants (mirrors slime.tscn PhysicsMaterial + project.godot)
  // ---------------------------------------------------------------------
  const WALL_SOUND_MIN_SPEED = 60; // px/s into the wall needed for a thud
  const COLLISION_FX_MIN_SPEED = 60; // px/s closing speed needed for a bounce's score/particles/sound
  const BOUNCE = 0.8;         // physics_material_override.bounce (friction=0, combine=max)
  const FIXED_DT = 1 / 120;
  const MAX_STEPS_PER_FRAME = 6;

  // Main.tscn's original danger_radius (50) was sized for the old, much
  // smaller level-1 slime (radius 40). It was later scaled up ~2.6x for the
  // old square pool's much bigger level-1 slime, then scaled back down here
  // for BG2.png's narrow track (see SIZE_SCALE) — kept just under the local
  // clearance at the launcher anchor (~55 field px, from the track's alpha
  // mask) so the danger ring reads as a tight zone right at the track's end
  // instead of bleeding out past its edges.
  const DANGER_RADIUS = 126; // 42 x3
  // Launcher anchor: near the bottom of the ring's interior, at the
  // lowest point with ~150 field px of clearance (DANGER_RADIUS + margin) from the ring (found by
  // scanning BG2.png's interior distance field upward from its bottom) —
  // as fractions of BASE_W/BASE_H so it keeps working if the field size
  // ever changes. There's no "wall" rectangle to inset from; the launcher
  // just sits at a fixed point inside the pool.
  const LAUNCHER_ANCHOR_FX = 1034 / BG2_NATIVE_W, LAUNCHER_ANCHOR_FY = 2678 / BG2_NATIVE_H;
  let launcherPos = { x: BASE_W * LAUNCHER_ANCHOR_FX, y: BASE_H * LAUNCHER_ANCHOR_FY };
  const SHOOT_FORCE = 800.0;
  const MAX_DRAG = 200.0;
  const GAME_OVER_WAIT = 5.0; // seconds

  function layoutForViewport(){
    launcherPos = { x: viewW * LAUNCHER_ANCHOR_FX, y: viewH * LAUNCHER_ANCHOR_FY };
  }

  // ---------------------------------------------------------------------
  // Slime entity (Scripts/slime.gd)
  // ---------------------------------------------------------------------
  // The character art (images/*.png) draws its tube-float ring with some
  // padding inside the square canvas — the ring doesn't reach the image's
  // edges — so the physics collider is shrunk from the drawn size to
  // match where the ring actually is, instead of the full image bounds.
  const COLLIDER_SCALE = 0.84; // 0.8 bumped up ~5%
  let nextId = 1;
  function makeSlime(level, x, y, vx, vy){
    const data = getSlimeData(level);
    // Idle cute tilt: each slime keeps a slow constant spin of its own so it
    // never sits perfectly upright. Collisions kick `spin` faster and it
    // relaxes back down to `idleSpin` over time (see updateSlimeAnim).
    const idleSpin = (0.15 + Math.random() * 0.35) * (Math.random() < 0.5 ? -1 : 1);
    const visualRadius = data.size / 2.0;
    return {
      id: nextId++,
      level,
      x, y,
      vx, vy,
      radius: visualRadius * COLLIDER_SCALE, // physics collider — see COLLIDER_SCALE note above
      visualRadius,                          // drawn (image) size, unaffected by the collider shrink
      mass: 1.0,
      isMerging: false,
      spawnAt: now(),
      angle: Math.random() * Math.PI * 2,
      idleSpin,
      spin: idleSpin,
    };
  }

  let slimes = [];

  function spawnSlimeAt(x, y, level, vx, vy){
    const s = makeSlime(level, x, y, vx || 0, vy || 0);
    slimes.push(s);
    return s;
  }

  // ---------------------------------------------------------------------
  // Launcher state (Scripts/launcher.gd)
  // ---------------------------------------------------------------------
  const launcher = {
    isDragging: false,
    dragPos: { x: 0, y: 0 },
    nextLevel: 1,    // the critter sitting on the launcher, fired next
    queueLevel: 0,   // the one after that (shown in the "Next" panel); 0 = not rolled yet
    loadedAt: 0,     // when nextLevel was loaded onto the launcher (pop-in anim)
    previewAngle: 0, // current rock angle of the launcher critter, handed to the shot slime
    canShoot: true,
    dangerElapsed: 0,
    dangerActive: false,
  };

  function rollLevel(){ return 1 + Math.floor(Math.random() * 2); } // randi_range(1,2)

  // Advances the queue: the "Next" critter moves onto the launcher and a new
  // one is rolled for the panel.
  function prepareNextSlime(){
    launcher.nextLevel = launcher.queueLevel || rollLevel();
    launcher.queueLevel = rollLevel();
    launcher.loadedAt = now();
    updateNextPreview();
  }

  // Returns false when the drag was too short to count as a shot.
  function shootSlime(){
    const dx = launcher.dragPos.x - launcherPos.x;
    const dy = launcher.dragPos.y - launcherPos.y;
    const len = Math.hypot(dx, dy);
    if (len < 10.0) return false;
    const dirX = dx / len, dirY = dy / len;
    const power = Math.min(len, MAX_DRAG) / MAX_DRAG;
    const s = spawnSlimeAt(launcherPos.x, launcherPos.y, launcher.nextLevel, 0, 0);
    // It was already visible on the launcher — keep its pose and skip the
    // spawn pop so the shot reads as the same critter leaving.
    s.angle = launcher.previewAngle;
    s.spawnAt = now() - 1000;
    // apply_central_impulse(impulse) with mass 1 -> velocity += impulse
    s.vx = dirX * SHOOT_FORCE * power;
    s.vy = dirY * SHOOT_FORCE * power;
    spawnRipple(launcherPos.x, launcherPos.y);
    return true;
  }

  // ---------------------------------------------------------------------
  // Score UI state — score is shown in the left side panel (DOM), with a
  // quick CSS "bump" animation on change standing in for main.gd's old
  // score bounce tween.
  // ---------------------------------------------------------------------
  // Several collisions can score within one frame (up to 6 physics steps),
  // and each DOM update forces a reflow to restart the bump animation — so
  // changes only mark the score dirty and flushScore() applies them once
  // per frame.
  let scoreDirty = false;
  function onScoreChanged(){ scoreDirty = true; }
  function flushScore(){
    if (!scoreDirty) return;
    scoreDirty = false;
    scoreValueEl.textContent = String(GameManager.currentScore);
    scoreValueEl.classList.remove("bump");
    void scoreValueEl.offsetWidth; // reflow to restart the animation
    scoreValueEl.classList.add("bump");
  }

  // ---------------------------------------------------------------------
  // Leaderboard — top scores, saved via Store. Rendered into
  // both the inline list (left side panel, "side" layout) and the popup
  // list (opened via the leaderboard button in "top" layout) — whichever
  // one is actually visible, the other just stays offscreen/hidden.
  // ---------------------------------------------------------------------
  const LEADERBOARD_KEY = "catMergeLeaderboard";
  const LEADERBOARD_MAX = 5;
  function loadLeaderboard(){
    try{
      const raw = Store.get(LEADERBOARD_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      if (Array.isArray(parsed)) return parsed.filter(n => typeof n === "number");
    } catch(e){ /* ignore corrupt save */ }
    return [];
  }
  let leaderboard = []; // filled by loadSaves()
  function saveLeaderboard(){
    Store.set(LEADERBOARD_KEY, JSON.stringify(leaderboard));
  }
  function renderLeaderboardInto(el){
    el.innerHTML = "";
    if (!leaderboard.length){
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = t("noRecords");
      el.appendChild(li);
      return;
    }
    leaderboard.forEach((score, i) => {
      const li = document.createElement("li");
      const rank = document.createElement("span");
      rank.textContent = `${i + 1}.`;
      const val = document.createElement("span");
      val.textContent = String(score);
      li.appendChild(rank);
      li.appendChild(val);
      el.appendChild(li);
    });
  }
  function renderLeaderboard(){
    renderLeaderboardInto(leaderboardListEl);
    renderLeaderboardInto(leaderboardListModalEl);
  }
  function submitScoreToLeaderboard(score){
    if (score <= 0) return;
    if (leaderboard.length > 0 && score > leaderboard[0]) CG.happytime(); // new best
    leaderboard.push(score);
    leaderboard.sort((a, b) => b - a);
    leaderboard = leaderboard.slice(0, LEADERBOARD_MAX);
    saveLeaderboard();
    renderLeaderboard();
    submitPlayGamesScore(score);
  }

  // ---------------------------------------------------------------------
  // Game over state (main.gd _on_game_over / game_over_screen.gd)
  // ---------------------------------------------------------------------
  let gameOver = false;
  let restartBtnRect = null;
  let restartPressedVisual = false;

  function triggerGameOver(){
    if (gameOver) return;
    gameOver = true;
    CG.setPlaying(false);
    document.body.classList.add("game-over");
    playGameOverSound();
    submitScoreToLeaderboard(GameManager.currentScore);
  }

  function restartGame(){
    slimes = [];
    GameManager.currentScore = 0;
    onScoreChanged();
    gameOver = false;
    document.body.classList.remove("game-over");
    launcher.isDragging = false;
    launcher.canShoot = true;
    launcher.dangerElapsed = 0;
    launcher.dangerActive = false;
    ripples.length = 0;
    pops.length = 0;
    particles.length = 0;
    launcher.queueLevel = 0;
    prepareNextSlime();
    CG.setPlaying(uiState === "playing");
    if (audioCtx && bgmAudio.paused) bgmAudio.play().catch(() => {});
  }

  // ---------------------------------------------------------------------
  // Small ripple FX on shoot (purely cosmetic)
  // ---------------------------------------------------------------------
  const ripples = [];
  function spawnRipple(x, y){ ripples.push({ x, y, t: 0 }); }
  function updateRipples(dt){
    for (let i = ripples.length - 1; i >= 0; i--){
      ripples[i].t += dt;
      if (ripples[i].t > 0.5) ripples.splice(i, 1);
    }
  }

  // ---------------------------------------------------------------------
  // Physics step
  // ---------------------------------------------------------------------
  function physicsStep(dt){
    if (gameOver) return;

    // --- Danger-zone detection (Launcher._physics_process) ---
    let slimeInDanger = false;
    for (const s of slimes){
      const d = Math.hypot(s.x - launcherPos.x, s.y - launcherPos.y);
      if (d < DANGER_RADIUS + s.radius){ slimeInDanger = true; break; }
    }
    if (slimeInDanger){
      launcher.canShoot = false;
      if (launcher.isDragging) launcher.isDragging = false;
      launcher.dangerActive = true;
      launcher.dangerElapsed += dt;
      if (launcher.dangerElapsed >= GAME_OVER_WAIT){
        triggerGameOver();
        return;
      }
    } else {
      launcher.canShoot = true;
      launcher.dangerActive = false;
      launcher.dangerElapsed = 0;
    }

    // --- Integrate ---
    for (const s of slimes){ s.x += s.vx * dt; s.y += s.vy * dt; }

    // --- Wall collisions (BG2.png's track shape, via its distance field —
    // see buildTrackMask()/sampleTrackDistance() above; no straight walls
    // anymore, so this replaces the old 4-way rectangle clamp) ---
    if (trackReady) for (const s of slimes){
      const d = sampleTrackDistance(s.x, s.y);
      if (d < s.radius){
        const n = sampleTrackNormal(s.x, s.y); // points away from the nearest wall, into the track
        s.x += n.x * (s.radius - d);
        s.y += n.y * (s.radius - d);
        const vn = s.vx * n.x + s.vy * n.y;
        if (vn < 0){ // only reflect while still moving into the wall
          s.vx -= (1 + BOUNCE) * vn * n.x;
          s.vy -= (1 + BOUNCE) * vn * n.y;
          // Same tangential-slide spin convention as the pairwise collision
          // response below (tangent = normal rotated 90°).
          spinKick(s, s.vx * -n.y + s.vy * n.x);
          // Bumping the pool edge makes the same thud (skip gentle grazes
          // so resting/sliding critters don't buzz).
          if (-vn > WALL_SOUND_MIN_SPEED) playCollisionSound(s.level);
        }
      }
    }

    // --- Pairwise circle collisions + merge detection ---
    const toSpawn = [];
    const n = slimes.length;
    for (let i = 0; i < n; i++){
      const a = slimes[i];
      if (a.isMerging) continue;
      for (let j = i + 1; j < n; j++){
        const b = slimes[j];
        if (b.isMerging) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const minDist = a.radius + b.radius;
        if (dx * dx + dy * dy >= minDist * minDist) continue;

        if (a.level === b.level){
          // slime.gd::_on_body_entered -> merge_with
          a.isMerging = true;
          b.isMerging = true;
          const midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
          const totalMass = a.mass + b.mass;
          const fvx = (a.mass * a.vx + b.mass * b.vx) / totalMass;
          const fvy = (a.mass * a.vy + b.mass * b.vy) / totalMass;
          const nextLevel = a.level + 1;
          // Two deer (the last friend) merging just vanish — no next level.
          if (a.level < DEER_LEVEL && SLIME_DATA[nextLevel]){
            toSpawn.push({ x: midX, y: midY, level: nextLevel, vx: fvx, vy: fvy });
            pulseEvolution(nextLevel);
          } else pulseEvolution(a.level);
          const mergeScore = getSlimeData(a.level).score;
          GameManager.addScore(mergeScore);
          spawnPop(midX, midY, getSlimeData(a.level).color);
          spawnMergeParticles(midX, midY, mergeScore);
          playMergeSound(a.level);
          triggerHapticFeedback(a.level);
          tutorialOnMerge();
          break; // a is now merging, stop checking it against further partners
        } else {
          const dist = Math.hypot(dx, dy) || 0.0001;
          // Elastic collision response (equal masses, restitution BOUNCE)
          const nx = dx / dist, ny = dy / dist;
          const overlap = minDist - dist;
          const push = overlap / 2;
          a.x -= nx * push; a.y -= ny * push;
          b.x += nx * push; b.y += ny * push;

          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const velAlongNormal = rvx * nx + rvy * ny;
          if (velAlongNormal < 0){
            const invMassSum = 1 / a.mass + 1 / b.mass;
            const j = -(1 + BOUNCE) * velAlongNormal / invMassSum;
            const jx = j * nx, jy = j * ny;
            a.vx -= jx / a.mass; a.vy -= jy / a.mass;
            b.vx += jx / b.mass; b.vy += jy / b.mass;

            // Spin them in opposite directions based on how much they were
            // sliding past each other (tangential to the collision normal)
            // — a glancing hit makes them twirl.
            const tx = -ny, ty = nx;
            const tangentialRel = rvx * tx + rvy * ty;
            spinKick(a, -tangentialRel);
            spinKick(b, tangentialRel);

            // Plain bounces score too now, just a small amount — the big
            // payouts stay reserved for merges. Gentle contacts (critters
            // jostling in a crowded pool) are skipped, same as wall grazes,
            // so a pile-up doesn't spam score/particles/sound every step.
            if (-velAlongNormal > COLLISION_FX_MIN_SPEED){
              GameManager.addScore(COLLISION_SCORE);
              spawnCollisionParticles((a.x + b.x) / 2, (a.y + b.y) / 2);
              playCollisionSound(Math.min(a.level, b.level));
            }
          }
        }
      }
    }

    if (toSpawn.length){
      for (const spec of toSpawn) spawnSlimeAt(spec.x, spec.y, spec.level, spec.vx, spec.vy);
    }
    if (slimes.some(s => s.isMerging)) slimes = slimes.filter(s => !s.isMerging);

    updateSlimeAnim(dt);
    updateRipples(dt);
  }

  // ---------------------------------------------------------------------
  // Cute idle tilt + collision spin (purely cosmetic, no effect on the
  // physics bodies' actual size/position used for collision).
  // ---------------------------------------------------------------------
  const SPIN_RELAX = 2.2;      // 1/s — how fast `spin` eases back to `idleSpin`
  const SPIN_MAX = 8.0;        // rad/s clamp so a hard hit can't blur-spin
  const SPIN_KICK_SCALE = 0.016;

  function spinKick(s, tangentialSpeed){
    // Spin faster in a direction based on how it was sliding at impact.
    s.spin += tangentialSpeed * SPIN_KICK_SCALE;
    if (s.spin > SPIN_MAX) s.spin = SPIN_MAX;
    if (s.spin < -SPIN_MAX) s.spin = -SPIN_MAX;
  }

  function updateSlimeAnim(dt){
    for (const s of slimes){
      s.angle += s.spin * dt;
      s.spin += (s.idleSpin - s.spin) * SPIN_RELAX * dt;
    }
  }

  // Spawn-pop micro animation (purely cosmetic "cute" polish)
  const pops = [];
  function spawnPop(x, y, color){ pops.push({ x, y, color, t: 0 }); }
  function updatePops(dt){
    for (let i = pops.length - 1; i >= 0; i--){
      pops[i].t += dt;
      if (pops[i].t > 0.35) pops.splice(i, 1);
    }
  }

  // Impact particles — small white bursts for plain bounces, slightly
  // bigger blue bursts for merges.
  const particles = [];
  const MAX_PARTICLES = 300;
  function spawnParticleBurst(x, y, count, color, baseRadius, speed){
    count = Math.min(count, MAX_PARTICLES - particles.length);
    for (let i = 0; i < count; i++){
      const angle = Math.random() * Math.PI * 2;
      const spd = speed * (0.5 + Math.random() * 0.5);
      particles.push({
        x, y,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd,
        t: 0,
        life: 0.35 + Math.random() * 0.2,
        radius: baseRadius * (0.7 + Math.random() * 0.6),
        color
      });
    }
  }
  function spawnCollisionParticles(x, y){
    spawnParticleBurst(x, y, 8, "#ffffff", 6, 1400);
  }
  // More particles for bigger merges — level 1's score (10) is the baseline,
  // and each doubling of score (i.e. each level up) adds a few more.
  function spawnMergeParticles(x, y, score){
    const count = Math.round(12 + Math.log2(Math.max(score, 10) / 10) * 3);
    spawnParticleBurst(x, y, count, "#3aa0ff", 9, 3000);
  }
  function updateParticles(dt){
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.t += dt;
      if (p.t > p.life){ particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.9;
      p.vy *= 0.9;
    }
  }
  function drawParticles(){
    for (const p of particles){
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ease-out-back style pop, 0 -> 1 with a little overshoot
  function popScale(age, dur){
    if (age >= dur) return 1;
    const t = age / dur;
    const c = 1.7;
    const tt = t - 1;
    return 1 + (tt*tt*((c+1)*tt + c));
  }
  function spawnScaleFor(s){ return popScale((now() - s.spawnAt) / 1000, 0.18); }

  // ---------------------------------------------------------------------
  // Track floor: images/BG2.png drawn once over the fixed viewW×viewH
  // field (see the "Map/track art" section above — no nine-slice needed).
  // BG2.png is a peanut-shaped ring around an open interior, so it's drawn
  // on top of drawWater()'s sea (see render()) — the ring frames the water
  // and covers the water mask's soft edge.
  // ---------------------------------------------------------------------
  function drawPoolFrame(t){
    if (frameCache){
      blitLayer(frameCache);
    } else if (bgImage.complete && bgImage.naturalWidth > 0){
      // A soft glow following the image's own alpha silhouette — canvas
      // shadows render around whatever's opaque, so this traces the
      // track's curved edges for free without extracting a contour path.
      ctx.save();
      ctx.shadowColor = "rgba(255,255,255,0.6)";
      ctx.shadowBlur = 18;
      ctx.drawImage(bgImage, 0, 0, viewW, viewH);
      ctx.restore();
      ctx.save();
      ctx.shadowColor = "rgba(6,40,58,0.45)";
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;
      ctx.drawImage(bgImage, 0, 0, viewW, viewH);
      ctx.restore();
    } else {
      // Fallback fill while images/BG2.png is still loading.
      ctx.save();
      ctx.fillStyle = "#e2b98a";
      ctx.fillRect(0, 0, viewW, viewH);
      ctx.restore();
    }
  }

  // ---------------------------------------------------------------------
  // Static background cache. The sea gradient (masked to the pool) and the
  // ring art with its two shadow passes never move, but redrawing them from
  // the full-size BG2.png every frame cost ~16ms — most of a 60fps frame
  // budget. They're rendered once into canvases matching the main canvas's
  // physical size/transform and just blitted each frame; rebuilt whenever
  // resize() changes the canvas or the track mask finishes loading.
  // ---------------------------------------------------------------------
  let waterBaseCache = null, frameCache = null, poolClipPath = null;
  let bgCacheDirty = true;

  function makeLayer(){
    const c = document.createElement("canvas");
    c.width = canvas.width;
    c.height = canvas.height;
    const g = c.getContext("2d");
    g.setTransform(scale * DPR, 0, 0, scale * DPR, offsetX * DPR, offsetY * DPR);
    return { c, g };
  }

  function blitLayer(layer){
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(layer, 0, 0);
    ctx.restore();
  }

  // Only called once trackReady (which implies bgImage has loaded).
  function rebuildBgCache(){
    bgCacheDirty = false;

    // A proper sea fill (not just a faint tint) — deep tropical blue-teal,
    // near-opaque so the interior clearly reads as open water, clipped to
    // the ring's interior (waterMaskCanvas, built in buildTrackMask()).
    // The ring art is drawn over this afterward, hiding the mask's soft edge.
    const water = makeLayer();
    const grad = water.g.createLinearGradient(0, 0, 0, viewH);
    grad.addColorStop(0, "#7fdcea");
    grad.addColorStop(0.45, "#2ea9d6");
    grad.addColorStop(1, "#0c5f8c");
    water.g.fillStyle = grad;
    water.g.fillRect(0, 0, viewW, viewH);
    water.g.globalCompositeOperation = "destination-in";
    water.g.imageSmoothingEnabled = true;
    water.g.drawImage(waterMaskCanvas, 0, 0, viewW, viewH);
    waterBaseCache = water.c;

    // Ring art with a soft glow + drop shadow following the image's own
    // alpha silhouette — canvas shadows render around whatever's opaque,
    // so this traces the track's curved edges without a contour path.
    const frame = makeLayer();
    frame.g.save();
    frame.g.shadowColor = "rgba(255,255,255,0.6)";
    frame.g.shadowBlur = 18;
    frame.g.drawImage(bgImage, 0, 0, viewW, viewH);
    frame.g.restore();
    frame.g.save();
    frame.g.shadowColor = "rgba(6,40,58,0.45)";
    frame.g.shadowBlur = 10;
    frame.g.shadowOffsetY = 4;
    frame.g.drawImage(bgImage, 0, 0, viewW, viewH);
    frame.g.restore();
    frameCache = frame.c;

    // Clip for the animated water FX: the ring's outer edge. Anything that
    // spills past the interior lands under the ring art drawn on top.
    poolClipPath = new Path2D();
    if (poolOutline){
      poolOutline.pts.forEach((p, i) => i ? poolClipPath.lineTo(p.x, p.y) : poolClipPath.moveTo(p.x, p.y));
      poolClipPath.closePath();
    } else {
      poolClipPath.rect(0, 0, viewW, viewH);
    }
  }

  function drawWater(t){
    // Nothing to layer FX on until the track mask exists (drawPoolFrame
    // shows a flat fallback fill for that brief window).
    if (!trackReady || !waterBaseCache) return;
    blitLayer(waterBaseCache);

    ctx.save();
    ctx.clip(poolClipPath);

    // gentle drifting highlight streaks (vector-clean "waves")
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;
    for (let i = 0; i < 5; i++){
      const yOff = viewH * ((i + 0.5) / 5);
      const amp = 10 + (i % 2) * 6;
      const speed = 0.35 + i * 0.05;
      ctx.beginPath();
      for (let x = 0; x <= viewW; x += 14){
        const y = yOff + Math.sin((x * 0.02) + t * speed + i) * amp;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // ripples from shot slimes
    for (const r of ripples){
      const p = r.t / 0.5;
      ctx.beginPath();
      ctx.arc(r.x, r.y, 14 + p * 60, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,255,255,${0.35 * (1 - p)})`;
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    // merge "pop" flashes
    for (const p of pops){
      const t2 = p.t / 0.35;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 8 + t2 * 46, 0, Math.PI*2);
      ctx.strokeStyle = rgbToCss(hexToRgb(p.color), 0.5 * (1 - t2));
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    ctx.restore();
  }

  // ---------------------------------------------------------------------
  // Slime rendering — cute round-eyed pool "tube float"
  // ---------------------------------------------------------------------
  const WATER_MID = "#4fbfdd";
  function drawSlime(s){
    const scale = spawnScaleFor(s);
    const r = s.visualRadius * scale; // drawn (image) size — see COLLIDER_SCALE note on makeSlime
    if (r <= 0) return;
    const data = getSlimeData(s.level);
    const base = data.color;
    const img = getSlimeSprite(s.level, r * 2);

    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.angle); // idle cute tilt, sped up briefly by collisions

    if (img && (img.width > 0) && (img.complete === undefined || img.complete && img.naturalWidth > 0)){
      // character art already includes its own pool-float ring
      const d = r * 2;
      ctx.drawImage(img, -r, -r, d, d);
    } else {
      // fallback while the image is still loading: plain tube-float ring
      // sized to the (smaller) physics collider, same as the real ring
      const fr = s.radius * scale;
      ctx.beginPath();
      ctx.arc(0, 0, fr, 0, Math.PI*2);
      ctx.fillStyle = base;
      ctx.fill();
      ctx.lineWidth = Math.max(2, fr * 0.07);
      ctx.strokeStyle = rgbToCss(shade(base, -0.35));
      ctx.stroke();
    }

    ctx.restore();
  }

  // ---------------------------------------------------------------------
  // Launcher visuals (danger zone, aim line, next-slime preview)
  // ---------------------------------------------------------------------
  function drawLauncher(tSec){
    ctx.save();
    ctx.translate(launcherPos.x, launcherPos.y);

    // Danger zone: fills in with an ever-deeper red the longer a slime has
    // been sitting in it, so the 5-second game-over countdown (GAME_OVER_WAIT)
    // reads visually as "the zone is turning red" rather than a hidden timer.
    let dangerAlpha = 0.1;
    let progress = 0;
    if (launcher.dangerActive){
      progress = Math.min(1, launcher.dangerElapsed / GAME_OVER_WAIT);
      dangerAlpha = 0.1 + progress * 0.7;
    }
    const dangerGreen = Math.round(60 * (1 - progress));
    ctx.beginPath();
    ctx.arc(0, 0, DANGER_RADIUS, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,${dangerGreen},${dangerGreen},${dangerAlpha})`;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = `rgba(255,${dangerGreen},${dangerGreen},${0.5 + progress * 0.5})`;
    ctx.stroke();

    // Countdown pie: a clockwise progress sweep from the top that fills the
    // whole danger zone (not just its edge), completing a full circle exactly
    // as GAME_OVER_WAIT elapses — the actual "5 seconds of process" made
    // visible as a filling wedge, like a pie-chart timer.
    if (launcher.dangerActive && progress > 0){
      ctx.beginPath();
      const startAngle = -Math.PI / 2;
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, DANGER_RADIUS, startAngle, startAngle + Math.PI * 2 * progress);
      ctx.closePath();
      ctx.fillStyle = "rgba(255,20,20,0.55)";
      ctx.fill();
    }

    // Aim vector: the real drag, or the tutorial hand's demo drag.
    let aim = null;
    if (launcher.isDragging) aim = { x: launcher.dragPos.x - launcherPos.x, y: launcher.dragPos.y - launcherPos.y, ghost: false };
    else if (tutorial.ghost) aim = { x: tutorial.ghost.x, y: tutorial.ghost.y, ghost: true };
    if (aim && Math.hypot(aim.x, aim.y) <= 10.0) aim = null;

    const critterR = drawLauncherCritter(tSec, aim);

    if (aim){
      const len = Math.hypot(aim.x, aim.y);
      const start = Math.min(critterR * 0.85, len);
      ctx.beginPath();
      ctx.setLineDash([8, 6]);
      ctx.moveTo(aim.x / len * start, aim.y / len * start);
      ctx.lineTo(aim.x, aim.y);
      ctx.strokeStyle = aim.ghost ? "rgba(255,255,255,0.35)" : "rgba(255,255,255,0.6)";
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  // The critter waiting on the launcher (launcher.nextLevel): bobs gently
  // (no aim-direction stretch — it keeps its shape while aiming). Drawn
  // in launcher-local space (drawLauncher already translated). Returns the
  // drawn radius so the aim line can start at its edge.
  function drawLauncherCritter(tSec, aim){
    if (gameOver) return 0;
    const r = getSlimeData(launcher.nextLevel).size / 2;
    const img = getSlimeSprite(launcher.nextLevel, r * 2 * 1.2);
    if (!img || !img.width || img.complete === false || img.naturalWidth === 0) return 0;

    const rock = Math.sin(tSec * 2.2) * 0.1;
    launcher.previewAngle = rock;
    const pop = popScale((now() - launcher.loadedAt) / 1000, 0.25);
    const bob = 1 + Math.sin(tSec * 3) * 0.03;

    ctx.save();
    // Dimmed while the danger zone is occupied (can't shoot yet).
    ctx.globalAlpha = launcher.canShoot ? 1 : 0.35;
    ctx.scale(bob * pop, bob * pop);
    ctx.rotate(rock);
    ctx.drawImage(img, -r, -r, r * 2, r * 2);
    ctx.restore();
    return r * pop;
  }

  // ---------------------------------------------------------------------
  // Score + Game Over UI
  // ---------------------------------------------------------------------
  function drawGameOver(){
    ctx.save();

    const cx = viewW / 2, cy = viewH / 2;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // Translated strings vary a lot in length, so each line shrinks its
    // font as needed to stay within the pool width / button.
    const maxTextW = Math.min(viewW, BASE_W) - 160;
    fitFont("800", 128, t("gameOver"), maxTextW);
    ctx.fillStyle = "#ff5e64";
    ctx.fillText(t("gameOver"), cx, cy - 220);

    const scoreText = t("scoreLabel", { score: GameManager.currentScore });
    fitFont("600", 84, scoreText, maxTextW);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(scoreText, cx, cy - 40);

    const btnW = 560, btnH = 152;
    const bx = cx - btnW/2, by = cy + 100;
    restartBtnRect = { x: bx, y: by, w: btnW, h: btnH };
    ctx.beginPath();
    roundRectPath(bx, by, btnW, btnH, 30);
    ctx.fillStyle = restartPressedVisual ? "#2bade0" : "#33ccff";
    ctx.fill();
    fitFont("700", 80, t("restart"), btnW - 60);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(t("restart"), cx, by + btnH/2 + 4);

    ctx.textAlign = "left";
    ctx.restore();
  }

  function fitFont(weight, size, text, maxW){
    const family = "-apple-system, 'Segoe UI', sans-serif";
    ctx.font = `${weight} ${size}px ${family}`;
    const w = ctx.measureText(text).width;
    if (w > maxW) ctx.font = `${weight} ${Math.floor(size * maxW / w)}px ${family}`;
  }

  function roundRectPath(x, y, w, h, r){
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------
  function now(){ return performance.now(); }
  let lastT = null, accumulator = 0;

  // Opt in with ?perf=1. Bounded samples, no per-frame console/DOM writes.
  const perfEnabled = new URLSearchParams(location.search).get("perf") === "1";
  const perfSamples = [];
  if (perfEnabled) window.gamePerformance = {
    reset(){ perfSamples.length = 0; },
    summary(){
      const metric = key => {
        const values = perfSamples.map(s => s[key]).sort((a, b) => a - b);
        return values.length ? { mean: values.reduce((a, b) => a + b, 0) / values.length,
          p95: values[Math.ceil(values.length * 0.95) - 1] } : null;
      };
      return { samples: perfSamples.length, frameMs: metric("frameMs"),
        physicsMs: metric("physicsMs"), renderMs: metric("renderMs"),
        steps: metric("steps"), slimes: metric("slimes"), particles: metric("particles") };
    }
  };
  let frameRequest = null;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden){
      cancelAnimationFrame(frameRequest);
      frameRequest = null;
    } else if (frameRequest === null){
      lastT = null;
      accumulator = 0;
      frameRequest = requestAnimationFrame(frame);
    }
  });

  function frame(t){
    if (document.hidden){ frameRequest = null; return; }
    const started = perfEnabled ? now() : 0;
    if (lastT === null) lastT = t;
    let dt = (t - lastT) / 1000;
    const frameMs = dt * 1000;
    lastT = t;
    dt = Math.min(dt, 1/20);

    // Physics only advances while actually playing — paused behind the
    // main menu / settings overlay (the water/frame still render for a
    // pretty idle background, they just don't move the game forward).
    let steps = 0;
    if (uiState === "playing"){
      accumulator += dt;
      while (accumulator >= FIXED_DT && steps < MAX_STEPS_PER_FRAME){
        physicsStep(FIXED_DT);
        updatePops(FIXED_DT);
        updateParticles(FIXED_DT);
        accumulator -= FIXED_DT;
        steps++;
      }
    }

    const physicsEnded = perfEnabled ? now() : 0;

    flushScore();
    updateTutorial(t / 1000);
    const renderStarted = perfEnabled ? now() : 0;
    render(t / 1000);
    if (perfEnabled && frameMs > 0){
      if (perfSamples.length === 600) perfSamples.shift();
      perfSamples.push({ frameMs, physicsMs: physicsEnded - started,
        renderMs: now() - renderStarted, steps, slimes: slimes.length, particles: particles.length });
    }
    frameRequest = requestAnimationFrame(frame);
  }

  // ---------------------------------------------------------------------
  // Evolution guide — the merge order (fox -> ... -> deer) laid out along
  // the pool's outer edge, just outside the ring, growing in size like the
  // critters themselves. The newest level made by a merge pulses.
  // EVO_FROM/EVO_TO are the arc's ends, as fractions of the outline's
  // length measured clockwise from its topmost point (negative = before it).
  // ---------------------------------------------------------------------
  const EVO_FROM = -0.1, EVO_TO = 0.1;
  const EVO_GAP = 22;                         // field px between ring edge and icon
  const evoRadius = (i) => 58 + i * 8;        // icon radius per step (fractional ok), smallest first
  const evoPulseAt = {};                      // level -> time it was last made by a merge
  function pulseEvolution(level){ evoPulseAt[level] = now(); }

  let evolutionStopCache = null;
  let evolutionStopOutline = null;
  function evolutionStops(){
    if (evolutionStopOutline === poolOutline && evolutionStopCache) return evolutionStopCache;
    const count = SLIME_IMAGE_NAMES.length;
    const s0 = EVO_FROM * poolOutline.total, s1 = EVO_TO * poolOutline.total;
    const stops = [];
    for (let i = 0; i < count; i++){
      const r = evoRadius(i);
      const p = outlineAt(s0 + (s1 - s0) * (i / (count - 1)));
      stops.push({ x: p.x + p.nx * (EVO_GAP + r), y: p.y + p.ny * (EVO_GAP + r), r });
    }
    evolutionStopOutline = poolOutline;
    evolutionStopCache = stops;
    return stops;
  }

  // Grows fitBox to cover the guide (with room for the merge pulse), then
  // refits the view. Called once the outline has been traced.
  function updateFitBox(){
    const pad = 1.3;
    let { x0, y0, x1, y1 } = { x0: 0, y0: 0, x1: BASE_W, y1: BASE_H };
    for (const st of evolutionStops()){
      x0 = Math.min(x0, st.x - st.r * pad); x1 = Math.max(x1, st.x + st.r * pad);
      y0 = Math.min(y0, st.y - st.r * pad); y1 = Math.max(y1, st.y + st.r * pad);
    }
    fitBox = { x0, y0, x1, y1 };
    resize();
  }

  function drawEvolutionGuide(){
    if (!poolOutline) return;
    const count = SLIME_IMAGE_NAMES.length;
    const stops = evolutionStops();

    ctx.save();
    // Chevrons between neighbors, pointing toward the next level.
    for (let i = 0; i < count - 1; i++){
      const a = stops[i], b = stops[i + 1];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      const ux = dx / d, uy = dy / d;
      const mid = a.r + (d - a.r - b.r) / 2; // centered in the gap between the two icons
      const cx = a.x + ux * mid, cy = a.y + uy * mid;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(Math.atan2(uy, ux));
      ctx.beginPath();
      ctx.moveTo(-9, -14); ctx.lineTo(7, 0); ctx.lineTo(-9, 14);
      ctx.lineWidth = 8;
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#0f8fc4";
      ctx.stroke();
      ctx.restore();
    }

    ctx.imageSmoothingQuality = "high";
    for (let i = 0; i < count; i++){
      const st = stops[i], level = i + 1;
      const age = evoPulseAt[level] ? (now() - evoPulseAt[level]) / 1000 : Infinity;
      const pulse = age < 0.6 ? Math.sin((age / 0.6) * Math.PI) : 0;
      const r = st.r * (1 + 0.25 * pulse);

      const img = getSlimeSprite(level, r * 2 * 0.95);
      if (img && img.width && img.complete !== false && img.naturalWidth !== 0){
        const d = r * 2 * 0.95;
        ctx.drawImage(img, st.x - d / 2, st.y - d / 2, d, d);
      }
    }
    ctx.restore();
  }

  function render(tSec){
    // Clear the WHOLE physical canvas first (identity transform) — the
    // fixed-size field is letterboxed/pillarboxed now, so there's often
    // space outside it (which just shows #stage's CSS background) that
    // the logical-space clear below wouldn't reach.
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(scale * DPR, 0, 0, scale * DPR, offsetX * DPR, offsetY * DPR);

    if (bgCacheDirty && trackReady) rebuildBgCache();
    drawWater(tSec);
    drawPoolFrame(tSec);
    drawEvolutionGuide();
    drawLauncher(tSec);
    for (const s of slimes) drawSlime(s);
    drawParticles();
    if (gameOver){
      // Dim the WHOLE physical canvas (identity transform), not just the
      // logical pool viewport — otherwise the letterbox/pillarbox space
      // around the pool stays bright. save()/restore() around the identity
      // transform preserves the logical transform for drawGameOver() below.
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = "rgba(13,13,26,0.85)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
      drawGameOver();
    }
  }

  // ---------------------------------------------------------------------
  // Input (Pointer Events unify mouse + touch, like Godot's
  // InputEventMouseButton / InputEventScreenTouch handling in launcher.gd)
  // ---------------------------------------------------------------------
  function onPointerDown(clientX, clientY){
    if (uiState !== "playing") return;
    if (gameOver){
      // Any tap/click anywhere on screen restarts, not just the button.
      restartPressedVisual = true;
      return;
    }
    if (!launcher.canShoot) return;
    launcher.isDragging = true;
    const p = toLogical(clientX, clientY);
    launcher.dragPos = p;
  }
  function onPointerMove(clientX, clientY){
    if (uiState !== "playing") return;
    if (gameOver || !launcher.isDragging) return;
    launcher.dragPos = toLogical(clientX, clientY);
  }
  function onPointerUp(clientX, clientY){
    if (uiState !== "playing") return;
    if (gameOver){
      if (restartPressedVisual){
        restartGame();
        restartPressedVisual = false;
      }
      return;
    }
    if (launcher.isDragging){
      launcher.dragPos = toLogical(clientX, clientY);
      launcher.isDragging = false;
      // A tap without a real drag doesn't fire — and doesn't reroll the
      // launcher critter either.
      if (shootSlime()){
        prepareNextSlime();
        tutorialOnShot();
      }
    }
  }

  canvas.addEventListener("pointerdown", (e) => { ensureAudio(); canvas.setPointerCapture(e.pointerId); onPointerDown(e.clientX, e.clientY); });
  canvas.addEventListener("pointermove", (e) => onPointerMove(e.clientX, e.clientY));
  canvas.addEventListener("pointerup", (e) => onPointerUp(e.clientX, e.clientY));
  canvas.addEventListener("pointercancel", () => { launcher.isDragging = false; restartPressedVisual = false; });

  window.addEventListener("resize", resize);

  // ---------------------------------------------------------------------
  // Tutorial — shown on the first run only (flag saved via Store):
  //   "aim"    a hand demos dragging from the launcher critter, until the
  //            player's first real shot;
  //   "merge"  a tip shows matching critters merge, until the first merge;
  //   "praise" a short "nice!" confirmation, then done.
  // Separately, the first time a critter lingers in the danger zone, a
  // one-off hint explains the red timer.
  // ---------------------------------------------------------------------
  const TUTORIAL_KEY = "catMergeTutorialDone";
  const DANGER_HINT_KEY = "catMergeDangerHintDone";
  function loadFlag(key){ return Store.get(key) === "1"; }
  function saveFlag(key){ Store.set(key, "1"); }

  // step/dangerHintDone are read from the save in loadSaves().
  const tutorial = {
    step: "done",
    stepAt: 0,
    dangerHintDone: true,
    dangerHintOn: false,
    ghost: null, // demo drag vector (launcher-local) drawn by drawLauncher while the hand is "pressed"
  };

  function tutorialOnShot(){
    if (tutorial.step === "aim"){ tutorial.step = "merge"; tutorial.stepAt = now(); }
  }
  function tutorialOnMerge(){
    if (tutorial.step === "merge"){ tutorial.step = "praise"; tutorial.stepAt = now(); }
  }

  const tutorialTipEl = document.getElementById("tutorialTip");
  const tutorialHandEl = document.getElementById("tutorialHand");
  const tipImg = (name) => `<img src="images/${name}.png" alt="">`;
  const TIP_HTML = {
    aim: () => t("tipAim"),
    merge: () => `<div class="tip-merge-row">${tipImg(SLIME_IMAGE_NAMES[0])}+${tipImg(SLIME_IMAGE_NAMES[0])}→${tipImg(SLIME_IMAGE_NAMES[1])}</div>`
         + t("tipMerge"),
    praise: () => t("tipPraise"),
    danger: () => t("tipDanger"),
  };
  let tipKey = null;
  // Bubble's measured size, cached so setTip() doesn't read offsetWidth
  // right after updateHand()'s style writes (a forced layout every frame).
  // Cleared whenever the content or viewport changes.
  let tipSize = null;
  // Forces setTip() to rebuild the bubble on its next call (language change).
  function refreshTip(){ tipKey = null; tutorialTipEl.classList.remove("show"); }

  // Logical (pool) coords -> CSS px on screen.
  function toScreen(x, y){ return { x: offsetX + x * scale, y: offsetY + y * scale }; }

  function setTip(key){
    if (key !== tipKey){
      if (key) tutorialTipEl.innerHTML = TIP_HTML[key]();
      tutorialTipEl.classList.toggle("show", !!key);
      tipKey = key;
      tipSize = null;
    }
    if (!key) return;
    // Anchored above the launcher, clamped to stay fully on screen.
    const a = toScreen(launcherPos.x, launcherPos.y - DANGER_RADIUS * 4.6);
    if (!tipSize) tipSize = { w: tutorialTipEl.offsetWidth, h: tutorialTipEl.offsetHeight };
    const { w, h } = tipSize;
    const x = Math.min(Math.max(a.x, 16 + w / 2), cssW - 16 - w / 2);
    const y = Math.max(a.y, h + 8);
    tutorialTipEl.style.transform = `translate(${x - w / 2}px, ${y - h}px)`;
  }

  // Demo drag loop (seconds): fade in on the critter, press, drag up
  // toward open water, hold, release, fade out, pause.
  const HAND_CYCLE = 2.6;
  const HAND_TARGET = { x: 90, y: -300 }; // launcher-local, into the pool
  function easeInOut(t){ return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }
  function updateHand(tSec, show){
    if (!show){ tutorialHandEl.style.opacity = "0"; return; }
    const t = tSec % HAND_CYCLE;
    let k = 0, opacity = 1, press = 0;
    if (t < 0.25){ opacity = t / 0.25; }
    else if (t < 0.45){ press = (t - 0.25) / 0.2; }
    else if (t < 1.35){ press = 1; k = easeInOut((t - 0.45) / 0.9); }
    else if (t < 1.6){ press = 1; k = 1; }
    else if (t < 1.8){ press = 1 - (t - 1.6) / 0.2; k = 1; }
    else if (t < 2.2){ k = 1; opacity = 1 - (t - 1.8) / 0.4; }
    else { opacity = 0; }
    const lx = HAND_TARGET.x * k, ly = HAND_TARGET.y * k;
    if (press > 0.5 && k > 0) tutorial.ghost = { x: lx, y: ly };
    const p = toScreen(launcherPos.x + lx, launcherPos.y + ly);
    // Sized relative to the pool (full size at a ~720px-tall desktop view)
    // so it doesn't swamp the critter on small phone screens.
    const size = Math.min(1.2, Math.max(0.6, scale / 0.33));
    // 26/3.5 = fingertip offset inside the 56x70 hand (see #tutorialHand)
    tutorialHandEl.style.transform = `translate(${p.x - 26}px, ${p.y - 3.5}px) scale(${size * (1 - 0.15 * press)})`;
    tutorialHandEl.style.opacity = String(opacity);
  }

  function updateTutorial(tSec){
    const active = uiState === "playing" && !gameOver;
    tutorial.ghost = null;
    let tip = null;

    if (active){
      if (tutorial.step === "aim") tip = "aim";
      else if (tutorial.step === "merge") tip = "merge";
      else if (tutorial.step === "praise"){
        tip = "praise";
        if (now() - tutorial.stepAt > 2200){ tutorial.step = "done"; saveFlag(TUTORIAL_KEY); tip = null; }
      }
    }

    if (active && !tutorial.dangerHintDone && launcher.dangerActive && launcher.dangerElapsed > 0.8) tutorial.dangerHintOn = true;
    if (tutorial.dangerHintOn){
      if (active && launcher.dangerActive) tip = "danger";
      else { tutorial.dangerHintOn = false; tutorial.dangerHintDone = true; saveFlag(DANGER_HINT_KEY); }
    }

    updateHand(tSec, active && tutorial.step === "aim" && !launcher.isDragging && launcher.canShoot);
    setTip(tip);
  }

  // ---------------------------------------------------------------------
  // Settings / leaderboard UI wiring (Scripts equivalent: none in the
  // original Godot project — new for the web port). There's no main menu:
  // CrazyGames wants new players landed straight in gameplay, so the game
  // goes "loading" -> "playing" on its own once the SDK and saves are in.
  // ---------------------------------------------------------------------
  let uiState = "loading"; // "loading" | "playing" | "settings" | "leaderboard"

  const settingsEl = document.getElementById("settingsScreen");
  const btnSettingsClose = document.getElementById("btnSettingsClose");
  const soundToggleEl = document.getElementById("soundToggle");
  const volumeSliderEl = document.getElementById("volumeSlider");
  const btnInGameSettings = document.getElementById("btnInGameSettings");
  const leftPanelEl = document.getElementById("leftPanel");
  const rightPanelEl = document.getElementById("rightPanel");
  const scoreValueEl = document.getElementById("scoreValue");
  const leaderboardListEl = document.getElementById("leaderboardList");
  const nextPreviewImgEl = document.getElementById("nextPreviewImg");
  const nextPreviewWrapEl = document.getElementById("nextPreviewWrap");
  const leaderboardScreenEl = document.getElementById("leaderboardScreen");
  const leaderboardListModalEl = document.getElementById("leaderboardListModal");
  const btnLeaderboard = document.getElementById("btnLeaderboard");
  const btnLeaderboardClose = document.getElementById("btnLeaderboardClose");

  function updateUiVisibility(){
    settingsEl.classList.toggle("hidden", uiState !== "settings");
    leaderboardScreenEl.classList.toggle("hidden", uiState !== "leaderboard");
    btnInGameSettings.classList.toggle("hidden", uiState !== "playing");
    leftPanelEl.classList.toggle("hidden", uiState !== "playing");
    rightPanelEl.classList.toggle("hidden", uiState !== "playing");
    CG.setPlaying(uiState === "playing" && !gameOver);
  }

  function updateNextPreview(){
    const data = getSlimeData(launcher.queueLevel);
    nextPreviewImgEl.src = getSlimeImage(launcher.queueLevel).src;
    nextPreviewWrapEl.style.background = rgbToCss(hexToRgb(data.color), 0.18);
  }

  function syncSettingsUI(){
    document.getElementById("vibrationToggle").checked = settings.vibrationOn;
    refreshPlayGames();
    soundToggleEl.checked = settings.soundOn;
    volumeSliderEl.value = String(Math.round(settings.volume * 100));
    volumeSliderEl.disabled = !settings.soundOn;
  }

  function openSettings(){
    syncSettingsUI();
    uiState = "settings";
    updateUiVisibility();
  }

  btnInGameSettings.addEventListener("click", () => { ensureAudio(); openSettings(); });
  btnSettingsClose.addEventListener("click", () => {
    uiState = "playing";
    updateUiVisibility();
  });
  btnLeaderboard.addEventListener("click", () => {
    if (playGamesPlugin()) { openPlayGamesLeaderboard(); return; }
    renderLeaderboardInto(leaderboardListModalEl);
    uiState = "leaderboard";
    updateUiVisibility();
  });
  btnLeaderboardClose.addEventListener("click", () => {
    uiState = "playing";
    updateUiVisibility();
  });
  soundToggleEl.addEventListener("change", () => {
    settings.soundOn = soundToggleEl.checked;
    volumeSliderEl.disabled = !settings.soundOn;
    applyAudioSettings();
    saveSettings();
  });
  volumeSliderEl.addEventListener("input", () => {
    settings.volume = Number(volumeSliderEl.value) / 100;
    applyAudioSettings();
    saveSettings();
  });

  // ---------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------
  resize();
  prepareNextSlime();
  applyLanguage(); // also renders the leaderboard
  updateUiVisibility();
  frameRequest = requestAnimationFrame(frame);

  // No browser context menu (right-click / long-press on images).
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  // iOS puts the AudioContext into "interrupted" after backgrounding and
  // only lets it resume inside a touchend/click gesture.
  for (const ev of ["touchend", "click"]){
    document.addEventListener(ev, () => {
      if (audioCtx && audioCtx.state !== "running") audioCtx.resume();
    }, { passive: true });
  }

  // Reads every save once the SDK (and so the Data module) is ready.
  function loadSaves(){
    loadSettings();
    leaderboard = loadLeaderboard();
    tutorial.step = loadFlag(TUTORIAL_KEY) ? "done" : "aim";
    tutorial.dangerHintDone = loadFlag(DANGER_HINT_KEY);
  }

  // =========================================================================
  // Native Mobile App Integration (Capacitor)
  // =========================================================================
  function isNativeApp(){ return !!window.Capacitor?.isNativePlatform?.(); }
  function playGamesPlugin(){
    return isNativeApp() && window.Capacitor.getPlatform() === "android" ? window.Capacitor.Plugins.PlayGames : null;
  }
  let playGamesBusy = false;
  function playGamesError(){ document.getElementById("playGamesStatus").textContent = t("playGamesError"); }
  async function refreshPlayGames(){
    const plugin = playGamesPlugin();
    if (!plugin) return;
    try {
      const state = await plugin.getStatus();
      document.getElementById("playGamesStatus").textContent = !state.configured ? t("playGamesSetup") : state.authenticated ? t("playGamesConnected", {name: state.displayName}) : t("playGamesOffline");
      document.getElementById("btnPlayGamesSignIn").disabled = !state.configured || state.authenticated;
      document.getElementById("btnPlayGamesLeaderboard").disabled = !state.configured;
    } catch (_) { playGamesError(); }
  }
  async function submitPlayGamesScore(score){
    const plugin = playGamesPlugin();
    if (!plugin) return;
    try {
      const state = await plugin.getStatus();
      if (state.authenticated) await plugin.submitScore({score});
    } catch (_) { playGamesError(); }
  }
  async function openPlayGamesLeaderboard(){
    const plugin = playGamesPlugin();
    if (!plugin || playGamesBusy) return;
    playGamesBusy = true;
    const previous = uiState;
    uiState = "leaderboard";
    updateUiVisibility();
    try {
      const state = await plugin.getStatus();
      if (!state.configured) { alert(t("playGamesSetup")); return; }
      if (!state.authenticated) await plugin.signIn();
      await plugin.showLeaderboard();
    } catch (_) { alert(t("playGamesError")); }
    finally { uiState = previous; updateUiVisibility(); playGamesBusy = false; }
  }
  document.getElementById("vibrationToggle").addEventListener("change", e => {
    settings.vibrationOn = e.target.checked;
    saveSettings();
  });
  document.getElementById("btnPlayGamesSignIn").addEventListener("click", async () => {
    const button = document.getElementById("btnPlayGamesSignIn");
    button.disabled = true;
    try { await playGamesPlugin().signIn(); await refreshPlayGames(); }
    catch (_) { button.disabled = false; playGamesError(); }
  });
  document.getElementById("btnPlayGamesAccount").addEventListener("click", () => playGamesPlugin().openAccountSettings().catch(playGamesError));
  document.getElementById("btnPlayGamesLeaderboard").addEventListener("click", openPlayGamesLeaderboard);
  function triggerHapticFeedback(level){
    if (isNativeApp() && !settings.vibrationOn) return;
    try {
      if (window.Capacitor && window.Capacitor.isPluginAvailable && window.Capacitor.isPluginAvailable("Haptics")) {
        const Haptics = window.Capacitor.Plugins.Haptics;
        if (level >= 6) {
          Haptics.impact({ style: "HEAVY" }).catch(() => {});
        } else if (level >= 3) {
          Haptics.impact({ style: "MEDIUM" }).catch(() => {});
        } else {
          Haptics.impact({ style: "LIGHT" }).catch(() => {});
        }
      } else if (navigator.vibrate) {
        navigator.vibrate(level >= 6 ? 40 : 20);
      }
    } catch (_) {}
  }

  function initCapacitorApp() {
    if (!isNativeApp()) return;
    document.getElementById("vibrationRow").classList.remove("hidden");
    if (playGamesPlugin()) {
      document.getElementById("playGamesSettings").classList.remove("hidden");
      refreshPlayGames();
      btnLeaderboard.style.display = "inline-block";
    }
    const plugins = window.Capacitor.Plugins || {};
    const { App, StatusBar, SplashScreen } = plugins;

    if (SplashScreen && SplashScreen.hide) {
      setTimeout(() => SplashScreen.hide().catch(() => {}), 300);
    }

    if (StatusBar && StatusBar.setOverlaysWebView) {
      StatusBar.setOverlaysWebView({ overlay: true }).catch(() => {});
    }

    if (App && App.addListener) {
      let resumeUiState = null;
      App.addListener("appStateChange", ({isActive}) => {
        if (!isActive) {
          resumeUiState = uiState;
          uiState = "nativePaused";
          updateUiVisibility();
        } else {
          if (resumeUiState !== null) { uiState = resumeUiState; resumeUiState = null; updateUiVisibility(); }
          refreshPlayGames();
        }
      });
      App.addListener("backButton", () => {
        if (privacyDialog.open) { privacyDialog.close(); return; }
        if (uiState === "settings" || uiState === "leaderboard") {
          uiState = "playing";
          updateUiVisibility();
        } else {
          if (confirm("게임을 종료하시겠습니까?")) {
            App.exitApp();
          }
        }
      });
    }
  }

  // CrazyGames: init the SDK, load saves, report loading until the page's
  // images are in, then drop the player straight into a run.
  const pageLoaded = document.readyState === "complete"
    ? Promise.resolve()
    : new Promise(r => window.addEventListener("load", r, { once: true }));
  CG.ready
    .then(() => { CG.loadingStart(); loadSaves(); return pageLoaded; })
    .then(() => {
      CG.loadingStop();
      applyAudioSettings();
      // Saved language + the SDK's user locale are only known now.
      applyLanguage();
      CG.onSettingsChange(applyAudioSettings);
      restartGame();
      uiState = "playing";
      updateUiVisibility();
      initCapacitorApp();
    });
})();
</script>
</body>
</html>
